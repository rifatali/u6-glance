name: refresh-u6-png

on:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: refresh-png
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Render + publish loop (20 x 15s)
        env:
          TZ: Europe/Berlin
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PUB=$(mktemp -d)
          cat > "$PUB/index.html" <<'HTML'
          <!doctype html><meta charset=utf-8>
          <title>Glance LED U6 feed</title>
          <style>body{background:#111;color:#eee;font-family:monospace;text-align:center;padding:2em}img{image-rendering:pixelated;border:1px solid #333;display:block;margin:.5em auto}</style>
          <h1>Berlin U6 Schwartzkopffstr.</h1>
          <p>Live PNG (refreshed every ~15 seconds):</p>
          <img src="u6.png?cb=auto" width="768" height="64" alt="alternating">
          <p>Or the two per-direction URLs:</p>
          <img src="tegel.png?cb=auto" width="768" height="64" alt="tegel">
          <img src="mariendorf.png?cb=auto" width="768" height="64" alt="mariendorf">
          <p><small>powered by v6.bvg.transport.rest</small></p>
          HTML
          touch "$PUB/.nojekyll"

          (
            cd "$PUB"
            git init -q -b gh-pages
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote add origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          )

          for i in $(seq 1 20); do
            echo "=== iteration $i / 20 ($(date -u +%H:%M:%SZ)) ==="
            python build.py "$PUB"

            (
              cd "$PUB"
              git add -A
              git -c commit.gpgsign=false commit -q --allow-empty \
                -m "refresh ($(date -u +%H:%M:%SZ))"
              git reset -q --soft $(git commit-tree HEAD^{tree} -m "u6 live") 2>/dev/null || true
              git push -q -f origin gh-pages
            )

            if [ "$i" -lt 20 ]; then sleep 15; fi
          done
